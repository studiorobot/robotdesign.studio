    description: Paper accepted to [HRI 2022](https://humanrobotinteraction.org/2022/) on robot-induced emotions and creativity.

  - date: March 7, 2022
    description: Organized HRI 2022 workshop on [theory-grounded HRI](https://theoriahri.wixsite.com/theoria).

  - date: January 1st, 2024
    description: Robot Studio started at the University of Michigan!

