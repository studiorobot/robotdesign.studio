    description: "[Systematic review paper](https://onlinelibrary.wiley.com/doi/10.1002/jocb.514) accepted at the Journal of Creative Behavior"

  - date: October 1st, 2021
    description: Paper accepted to [CoRL 2021](https://2021.corl.org/) on [robot nodding behavior](https://openreview.net/forum?id=0WDtVJVwBcf).

  - date: October 26th, 2021
    description: Paper accepted to Frontiers on [VR as a collaborative robot design tool](https://www.frontiersin.org/journals/virtual-reality/articles/10.3389/frvir.2021.746521/full).

