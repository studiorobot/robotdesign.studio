    description: Paper accepted to [DIS 2021](https://dis.acm.org/2021/) on [robot metaphors](https://dl.acm.org/doi/10.1145/3461778.3462060) - [video](https://www.youtube.com/watch?v=JpDV9FF3Sf0).

