    description: Paper accepted to [C&C 2021](https://dis.acm.org/2021/) on [robotics-based interventions](https://dl.acm.org/doi/fullHtml/10.1145/3450741.3465267) - [video](https://www.youtube.com/watch?v=6T-QjgF1AEo)

