    description: Prof. Patricia launched a new class at the Robotics Department called "[Design for Human-Robot Interaction](https://studiorobot.github.io/designforhri.github.io/)."

  - date: March 22nd, 2024
    description: Prof. Patricia was a keynote speaker at the Disability Visibility Symposium.

