patricia:
  name: Patrícia Alves-Oliveira
  role: Director of Robot Studio
  title: Ph.D., Assistant Professor of Robotics
  affiliated: Affiliated Faculty at [MIDAS](https://midas.umich.edu/) and [ESC](https://esc.umich.edu/)
  advisor: Research Advisor at [Open Style Lab](https://www.openstylelab.org/)
  email: robopati@umich.edu
  website: https://patricialvesoliveira.com/
  google_scholar: https://scholar.google.com/citations?hl=en&user=TbN31LMAAAAJ&view_op=list_works&alert_preview_top_rm=2&sortby=pubdate
  twitter: https://x.com/p_alvesoliveira
  linkedin: https://www.linkedin.com/in/patricia-alves-oliveira
  profile_img: team/patricia.jpg
  description: I research how humans connect with robots, and how robots influence human relations. I combine artificial intelligence, psychology, and design to understand how to build robots that people love. I collaborate with experts from Fine Arts, Medicine, and Humanities.

