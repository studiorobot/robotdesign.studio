settings:
  content:
    merge: true

media:
  - name: team
    label: Team photos
    input: team
    output: /team
    categories: [image]
  - name: press
    label: Press images
    input: press
    output: /press
    categories: [image]
  - name: publications
    label: Publications (PDFs & thumbnails)
    input: publications
    output: /publications
  - name: projects
    label: Project media
    input: projects
    output: /projects
  - name: homepage
    label: Homepage images
    input: homepage
    output: /homepage
    categories: [image]
  - name: resources
    label: Resource PDFs
    input: resources
    output: /resources
  - name: reflections
    label: Robo Reflections media
    input: assets/robo-reflections
    output: /assets/robo-reflections
  - name: rob340
    label: ROB 340 media (current semester)
    input: rob340/w25
    output: /rob340/w25

content:
  - name: news
    label: News
    type: file
    path: _data/news.yml
    format: yaml
    description: 'Newest items show first on the website. New items go at the bottom of this list — that is correct, the site reverses the order. Links: [text](https://url)'
    fields:
      - name: items
        label: News items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date}"
        fields:
          - name: date
            type: string
            description: e.g. September 12th, 2025
          - name: description
            type: text

  - name: homepage
    label: Homepage
    type: file
    path: _data/homepage.yml
    format: yaml
    fields:
      - name: carousel
        label: Carousel slides
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
          - name: description
            type: string
            description: Use <br> for a manual line break
          - name: image
            type: image
            options:
              media: homepage
              path: homepage/carousel
      - name: research_vision
        label: Research vision
        type: text

  - name: team
    label: Team
    type: file
    path: _data/team.yml
    format: yaml
    description: Members are sorted automatically on the website (Post-Doc, Ph.D., Masters, Undergrad — alphabetical within each), so new people can be added anywhere. Link fields need full URLs starting with https://
    fields:
      - name: patricia
        label: Patrícia (Director)
        type: object
        fields:
          - name: name
            type: string
          - name: role
            type: string
          - name: title
            type: string
          - name: meta_advisory_board
            label: Meta advisory board
            type: string
          - name: affiliated
            type: string
          - name: academic_guest
            type: string
          - name: advisor
            type: string
          - name: email
            type: string
          - name: website
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
          - name: google_scholar
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
          - name: twitter
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
          - name: linkedin
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
          - name: profile_img
            label: Profile photo
            type: image
            options:
              media: team
          - name: description
            type: text
      - name: members
        label: Active members
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} ({standing})"
        fields:
          - name: name
            type: string
            required: true
          - name: standing
            type: select
            required: true
            options:
              values: [Post-Doc, Ph.D., Masters, Undergrad]
          - name: major
            type: string
          - name: university
            type: string
          - name: project
            type: string
            description: Project name(s), comma-separated
          - name: role
            type: string
          - name: joined
            type: string
            description: e.g. Fall 2025
          - name: personal_website
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
          - name: google_scholar
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
          - name: linkedin
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
          - name: github
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
          - name: youtube
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
          - name: img
            label: Photo
            type: image
            options:
              media: team
      - name: collab
        label: Collaborators
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            type: string
            required: true
          - name: role
            type: string
          - name: university
            type: string
          - name: department
            type: string
          - name: img
            label: Photo
            type: image
            options:
              media: team
      - name: alumni
        label: Alumni
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} ({year})"
        fields:
          - name: name
            type: string
            required: true
          - name: future
            label: Where they went next
            type: string
          - name: project
            type: string
          - name: year
            label: Semesters
            type: string
            description: e.g. F24-W25, or S25 for a single term (F=Fall, W=Winter, S=Summer)
            pattern:
              regex: '^([FWS]\d{2}(-[FWS]\d{2})?)?$'
              message: Use semester codes like F24-W25 or S25 (F=Fall, W=Winter, S=Summer)
          - name: linkedin
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)

  - name: publications
    label: Publications
    type: file
    path: _data/publications.yml
    format: yaml
    description: 'Papers live inside their year. To add a paper, open the year and add an item at the bottom — the site shows newest first automatically. To start a new year, add an item at the bottom of the years list. Make thumbnails / trim PDF pages with the mediate tool: https://studiorobot.github.io/mediate/'
    fields:
      - name: intro
        label: Intro text
        type: text
      - name: years
        label: Years
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{year}"
        fields:
          - name: year
            type: number
            required: true
          - name: papers
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                type: string
                required: true
              - name: authors
                type: text
              - name: event
                label: Venue / event
                type: text
              - name: doi
                label: DOI link
                type: string
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
              - name: pdf
                label: PDF
                type: file
                description: 'Trim publisher cover pages with: studiorobot.github.io/mediate'
                options:
                  media: publications
                  path: publications
                  extensions: [pdf]
              - name: img
                label: Thumbnail
                type: image
                description: 'Generate from the PDF with: studiorobot.github.io/mediate'
                options:
                  media: publications
                  path: publications/thumbnails
              - name: project
                type: string
              - name: video
                label: Video link
                type: string
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
              - name: materials
                label: Materials link
                type: string
                description: External URL or a site path like /projects/active/aura/poster.pdf
                pattern:
                  regex: '^(https?://.+|/.+)?$'
                  message: Must be a full URL (https://...) or a site path starting with /

  - name: projects
    label: Projects
    type: file
    path: _data/projects.yml
    format: yaml
    fields:
      - name: intro
        label: Intro text
        type: text
      - name: active
        label: Active projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            type: string
            required: true
          - name: area
            type: string
          - name: members
            type: string
            description: Comma-separated names
          - name: data
            label: Dates & funding
            type: string
            description: e.g. 2024 - ongoing | NSF EAGER
          - name: description
            type: text
          - name: keywords
            type: string
          - name: poster
            label: Thumbnail image
            type: image
            options:
              media: projects
          - name: video_webm
            label: Video (webm)
            type: file
            options:
              media: projects
          - name: video_mp4
            label: Video (mp4)
            type: file
            options:
              media: projects
          - name: links
            type: object
            fields:
              - name: site
                label: Websites
                type: string
                list: true
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
              - name: doi
                label: DOIs
                type: string
                list: true
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
              - name: yt
                label: Videos
                type: string
                list: true
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
              - name: code
                label: Code links
                type: string
                list: true
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
          - name: awards
            type: object
            list: true
            fields:
              - name: title
                type: string
          - name: honorable_mentions
            type: object
            list: true
            fields:
              - name: title
                type: string
      - name: completed
        label: Completed projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            type: string
            required: true
          - name: area
            type: string
          - name: members
            type: string
            description: Comma-separated names
          - name: data
            label: Dates & funding
            type: string
            description: e.g. 2024 - ongoing | NSF EAGER
          - name: description
            type: text
          - name: keywords
            type: string
          - name: poster
            label: Thumbnail image
            type: image
            options:
              media: projects
          - name: video_webm
            label: Video (webm)
            type: file
            options:
              media: projects
          - name: video_mp4
            label: Video (mp4)
            type: file
            options:
              media: projects
          - name: links
            type: object
            fields:
              - name: site
                label: Websites
                type: string
                list: true
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
              - name: doi
                label: DOIs
                type: string
                list: true
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
              - name: yt
                label: Videos
                type: string
                list: true
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
              - name: code
                label: Code links
                type: string
                list: true
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
          - name: awards
            type: object
            list: true
            fields:
              - name: title
                type: string
          - name: honorable_mentions
            type: object
            list: true
            fields:
              - name: title
                type: string

  - name: press
    label: Press
    type: file
    path: _data/press.yml
    format: yaml
    list: true
    description: 'Newest first on the website and in this list. Links: [text](https://url) work in the description field.'
    fields:
      - name: date
        type: string
        description: e.g. August 13th, 2025
      - name: title
        type: string
        required: true
      - name: content
        type: text
      - name: description
        type: text
        description: Optional longer text with Markdown links (used instead of a single link)
      - name: image
        type: image
        options:
          media: press
      - name: link
        type: string
        pattern:
          regex: '^(https?://.+)?$'
          message: Must be a full URL starting with https:// (or left empty)

  - name: resources
    label: Resources
    type: file
    path: _data/resources.yml
    format: yaml
    list: true
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: text
      - name: pdf
        label: PDF
        type: file
        options:
          media: resources
          extensions: [pdf]
      - name: link
        type: string
        pattern:
          regex: '^(https?://.+)?$'
          message: Must be a full URL starting with https:// (or left empty)

  - name: join
    label: Join us
    type: file
    path: _data/join.yml
    format: yaml
    description: 'All texts support Markdown links: [text](https://url)'
    fields:
      - name: intro_text
        label: Intro
        type: text
      - name: phd_students_text
        label: Ph.D. students
        type: text
      - name: undergraduate_master_students_text
        label: Undergrad & Masters students
        type: text
      - name: visiting_students_text
        label: Visiting students
        type: text
      - name: postdocs_text
        label: Postdocs
        type: text

  - name: reflections-papers
    label: Robo Reflections – Papers
    type: file
    path: _data/robo-reflections/papers.yml
    format: yaml
    description: Papers live inside their semester. Add papers at the bottom of a semester — the site shows newest first automatically. To start a new semester, add an item at the bottom of the semesters list.
    fields:
      - name: semesters
        label: Semesters
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{semester}"
        fields:
          - name: semester
            type: string
            required: true
            description: e.g. Winter 2026
          - name: papers
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                type: text
                required: true
              - name: authors
                type: text
              - name: event
                label: Venue / event
                type: text
              - name: doi
                label: DOI link
                type: string
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
              - name: drive
                label: Private link (Drive)
                type: string
                pattern:
                  regex: '^(https?://.+)?$'
                  message: Must be a full URL starting with https:// (or left empty)
              - name: pdf
                label: PDF
                type: file
                options:
                  media: reflections
                  path: assets/robo-reflections/pdfs
                  extensions: [pdf]
              - name: img
                label: Thumbnail
                type: image
                options:
                  media: reflections
                  path: assets/robo-reflections/images/thumbnails
              - name: date
                type: string
                description: e.g. Feb 5th
              - name: presenter
                type: string

  - name: reflections-people
    label: Robo Reflections – People
    type: file
    path: _data/robo-reflections/people.yml
    format: yaml
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: section
        type: select
        required: true
        options:
          values: [Organizers, Supporting Faculty]
      - name: role
        type: string
      - name: inst
        label: Institution
        type: string
      - name: img
        label: Photo
        type: image
        options:
          media: reflections
          path: assets/robo-reflections/images/people
      - name: web
        label: Website
        type: string
        pattern:
          regex: '^(https?://.+)?$'
          message: Must be a full URL starting with https:// (or left empty)
      - name: in
        label: LinkedIn
        type: string
        pattern:
          regex: '^(https?://.+)?$'
          message: Must be a full URL starting with https:// (or left empty)
      - name: scholar
        label: Google Scholar
        type: string
        pattern:
          regex: '^(https?://.+)?$'
          message: Must be a full URL starting with https:// (or left empty)

  - name: reflections-site
    label: Robo Reflections – Texts
    type: file
    path: _data/robo-reflections/site.yml
    format: yaml
    description: 'All texts support Markdown links: [text](https://url)'
    fields:
      - name: intro
        type: text
      - name: format
        type: text
      - name: contact
        type: text

  - name: navigation
    label: Navigation
    type: file
    path: _data/navigation.yml
    format: yaml
    fields:
      - name: internal
        label: Site pages
        type: object
        list: true
        fields:
          - name: title
            type: string
          - name: url
            type: string
      - name: external
        label: Social links
        type: object
        list: true
        fields:
          - name: platform
            type: string
          - name: url
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
          - name: name
            type: string
          - name: icon
            type: string
            description: Font Awesome classes, e.g. fab fa-linkedin

  - name: courses
    label: Courses
    type: file
    path: _data/courses.yml
    format: yaml
    description: 'The course directory shown at /courses. Semesters live inside their course. Add new items at the bottom of a list — that is correct, the site shows newest first automatically. When a semester ends, fill in its instructors, GSIs, IAs and topics — this is what the archive page and Google search results show.'
    fields:
      - name: intro
        label: Intro text
        type: text
      - name: courses
        label: Courses
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{number}"
        fields:
          - name: number
            type: string
            required: true
            description: e.g. ROB 340
          - name: title
            type: string
            required: true
          - name: description
            type: text
          - name: topics
            label: Topics covered
            type: string
            list: true
            description: One topic per item, shown under the course description
          - name: semesters
            label: Semesters
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{term}"
            fields:
              - name: term
                type: string
                required: true
                description: e.g. Winter 2025
              - name: url
                type: string
                description: Site path like /rob340/w25/
              - name: current
                label: Currently running
                type: boolean
                description: Shows a "current" badge next to this semester
              - name: instructors
                label: Instructors
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name}"
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: url
                    type: string
                    pattern:
                      regex: '^(https?://.+)?$'
                      message: Must be a full URL starting with https:// (or left empty)
              - name: gsis
                label: GSIs
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name}"
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: url
                    type: string
                    pattern:
                      regex: '^(https?://.+)?$'
                      message: Must be a full URL starting with https:// (or left empty)
              - name: ias
                label: IAs
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name}"
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: url
                    type: string
                    pattern:
                      regex: '^(https?://.+)?$'
                      message: Must be a full URL starting with https:// (or left empty)

  - name: rob340-course
    label: ROB 340 – Course info
    type: file
    path: _data/rob340/course.yml
    format: yaml
    fields:
      - name: title
        type: string
        required: true
        description: 'e.g. ROB 340: Human Evaluation of Robots'
      - name: instructors
        label: Instructors
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            type: string
            required: true
          - name: url
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
      - name: GSIs
        label: GSIs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            type: string
            required: true
          - name: url
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
      - name: IAs
        label: IAs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            type: string
            required: true
          - name: url
            type: string
            pattern:
              regex: '^(https?://.+)?$'
              message: Must be a full URL starting with https:// (or left empty)
      - name: department
        type: string
      - name: university
        type: string
      - name: office
        type: string
        description: e.g. 2252 FRB
      - name: yellow_box
        label: Yellow info box
        type: object
        fields:
          - name: top-text
            label: Top text
            type: string
            description: e.g. This course is running in Winter 2025
          - name: sections
            label: Sections
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                type: string
                description: e.g. Lectures, Office Hours, Lab
              - name: date
                type: string
                description: e.g. Monday & Wednesday
              - name: time
                type: string
                description: e.g. 1:30 - 3:00 PM
              - name: location
                type: string
                description: e.g. GGBL 1025

  - name: rob340-schedule
    label: ROB 340 – Schedule
    type: file
    path: _data/rob340/schedule.yml
    format: yaml
    list: true
    description: The schedule sidebar on the course page.
    fields:
      - name: title
        type: string
        description: e.g. Lectures
      - name: sessions
        label: Sessions
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date}"
        fields:
          - name: date
            type: string
            description: e.g. 01/08
          - name: class
            type: string
            description: 'e.g. Class 1: Introduction'

  - name: rob340-grading
    label: ROB 340 – Grading
    type: file
    path: _data/rob340/grading.yml
    format: yaml
    list: true
    fields:
      - name: title
        type: string
        description: e.g. Exams - 25%
      - name: text
        label: Paragraphs
        type: string
        list: true

  - name: rob340-students
    label: ROB 340 – Students
    type: file
    path: _data/rob340/students.yml
    format: yaml
    fields:
      - name: undergraduates
        label: Undergraduates
        type: string
        list: true
      - name: graduates
        label: Graduates
        type: string
        list: true

  - name: rob340-main
    label: ROB 340 – Main sections
    type: file
    path: _data/rob340/main.yml
    format: yaml
    list: true
    description: The main text sections of the course page (description, learning objectives, ...). An item can be a titled text section, an image, or both.
    fields:
      - name: name
        label: Section title
        type: string
        description: e.g. Course Description
      - name: content
        type: text
        description: 'Markdown works here: lists with "- item", links with [text](https://url)'
      - name: image
        label: Show an image
        type: boolean
      - name: image_url
        label: Image
        type: image
        options:
          media: rob340
          path: rob340/w25/img

  - name: rob340-labs
    label: ROB 340 – Labs
    type: file
    path: _data/rob340/labs.yml
    format: yaml
    list: true
